<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イラストのウェブサイト</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px; /* コンテンツの最大幅を設定 */
            margin: 20px auto; /* 中央寄せ */
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
        }
        /* 画像のスタイル */
        img {
            max-width: 1000px; /* 親要素（.container）の幅に合わせて画像を縮小 */
            height: auto;    /* アスペクト比を維持 */
            display: block;  /* 画像の下の余白をなくす */
            margin: 0 auto 20px auto; /* 画像を中央寄せし、下に余白 */
            border: 1px solid #ddd; /* 画像に軽いボーダー */
            border-radius: 5px; /* 角を少し丸くする */
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .link-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .link-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>私の最新イラスト</h1>

        <img src="../image/girl.jpg" alt="可愛らしい女の子のイラスト">

        <p>
            このイラストは、私の最新作です。
            キャラクターデザインや色使いにこだわって制作しました。
            ぜひ、他の作品もご覧ください。
        </p>
